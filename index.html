<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naturin's – Snacks Naturales del Perú</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amaranth:wght@700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="font-['Inter'] bg-[#FDF6E3] text-[#2c1a00] min-h-screen flex flex-col">

  <!-- ── HEADER ── -->
  <header id="header"
    class="sticky top-0 w-full z-50 bg-white/97 backdrop-blur-md border-b-2 border-[#F1860B] h-[70px] flex items-center justify-between px-10 gap-6 shadow-sm">
  </header>

  <!-- Main-->
  <main class="flex-grow">

    <!-- ── HERO CARRUSEL ── -->
    <section class="relative bg-[#733702] pt-10 pb-16">
      <div
        class="relative w-[88%] max-w-5xl mx-auto h-[650px] rounded-2xl overflow-hidden border-[3px] border-[#F2B707] shadow-2xl">
        <!-- Slides -->
        <div id="carousel" class="flex w-full h-full transition-transform duration-500 ease-in-out">
          <img src="img/FOTOS_GRUPALES/camote.webp" alt="Chips de camote" class="w-full h-full object-cover shrink-0" />
          <img src="img/FOTOS_GRUPALES/haba.webp" alt="Habas naturales" class="w-full h-full object-cover shrink-0" />
          <img src="img/FOTOS_GRUPALES/manis.webp" alt="Maníes tostados" class="w-full h-full object-cover shrink-0" />
        </div>

        <!-- Botón prev -->
        <button onclick="prevSlide()" aria-label="Anterior"
          class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/45 hover:bg-[#F1860B]/80 text-white w-11 h-11 rounded-full flex items-center justify-center transition hover:scale-105 cursor-pointer z-10 border-0">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <!-- Botón next -->
        <button onclick="nextSlide()" aria-label="Siguiente"
          class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/45 hover:bg-[#F1860B]/80 text-white w-11 h-11 rounded-full flex items-center justify-center transition hover:scale-105 cursor-pointer z-10 border-0">
          <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Dots -->
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-10" id="dots">
          <button onclick="goToSlide(0)"
            class="dot w-2 h-2 rounded-full transition-all cursor-pointer border-0 bg-white/50"></button>
          <button onclick="goToSlide(1)"
            class="dot w-2 h-2 rounded-full transition-all cursor-pointer border-0 bg-white/50"></button>
          <button onclick="goToSlide(2)"
            class="dot w-2 h-2 rounded-full transition-all cursor-pointer border-0 bg-white/50"></button>
        </div>
      </div>
    </section>

    <!-- ── TRUST STRIP ── -->
    <div class="bg-[#98C01E] py-4 px-6 flex flex-wrap justify-center gap-8">
      <div class="flex items-center gap-2 text-white font-semibold text-sm">
        <i class="fa-solid fa-seedling text-base"></i> 100% Natural
      </div>
      <div class="flex items-center gap-2 text-white font-semibold text-sm">
        <i class="fa-solid fa-truck text-base"></i> Envío a todo el Perú
      </div>
      <div class="flex items-center gap-2 text-white font-semibold text-sm">
        <i class="fa-solid fa-star text-base"></i> Calidad garantizada
      </div>
      <div class="flex items-center gap-2 text-white font-semibold text-sm">
        <i class="fa-solid fa-heart text-base"></i> Sabor peruano auténtico
      </div>
    </div>

    <!-- ── CATEGORÍAS ── -->
    <section id="productos-categorias" class="bg-[#FFF8EC] border-t-4 border-[#F2B707] px-6 py-16">
      <h2 class="font-['Amaranth'] text-3xl text-[#733702] text-center mb-2">
        Compra por categorías
      </h2>
      <p class="text-center text-[#7a4a10] text-sm mb-12">
        Encuentra tus snacks naturales favoritos
      </p>

      <div id="categorias-container"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-8 max-w-6xl mx-auto">
      </div>

    </section>

  </main>

  <!-- ── FOOTER ── -->
  <footer id="footer" class="bg-[#733702] text-white border-t-4 border-[#F1860B] pt-14 pb-8 px-6"></footer>
  <script src="js/index-js/loadComponent.js"></script>
  <script src="js/index-js/carouse.js"></script>
  <script src="js/index-js/addCategories.js"></script>

</body>

</html>
