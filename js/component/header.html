<!-- Acciones -->
<div class="flex items-center gap-3">

  <!-- CARRITO -->
  <div class="relative">

    <!-- BOTÓN -->
    <button id="btn-carrito"
      class="flex items-center gap-2 text-sm font-semibold text-[#733702] px-3 py-2 rounded-lg hover:bg-[#733702]/8 transition">

      <i class="fa-solid fa-cart-shopping"></i>
      Carrito

      <!-- CONTADOR -->
      <span id="contador-carrito"
        class="ml-1 bg-[#E52619] text-white text-xs w-5 h-5 flex items-center justify-center rounded-full">
        0
      </span>
    </button>

    <!-- MINI CARRITO -->
    <div id="mini-carrito"
      class="hidden absolute right-0 mt-3 w-89 h-[500px] bg-white rounded-xl shadow-2xl p-4 z-50 border flex flex-col overflow-hidden">

      <h3 class="font-bold mb-3 text-[#733702]">Carrito de Compra</h3>

      <!-- ITEMS -->
      <div id="mini-items" class="space-y-3 max-h-60 overflow-y-auto"></div>

      <div class="border-t mt-3 pt-3 text-sm">
      </div>

      <!-- BOTÓN -->

      <div id="mini-footer" class="mt-auto pt-3 border-t space-y-2">
        <div class="text-sm">
        Total: <span id="mini-total" class="font-bold">S/ 0.00</span>
       </div>

        <button id="btn-finalizar-mini"
          class="w-full bg-[#1a4731] text-white py-2 rounded-lg hover:bg-[#245e41] transition text-sm font-semibold">
          Finalizar compra
        </button>

        <a href="Carrito.html"
          class="block w-full text-center bg-[#E52619] text-white py-2 rounded-lg hover:bg-red-700 transition text-sm font-semibold">

      </div>
