<!-- Card -->
<article
  class="group flex h-full flex-col overflow-hidden rounded-3xl bg-white shadow-md ring-1 ring-black/5 transition duration-300 hover:-translate-y-1 hover:shadow-xl">

  <!-- Imagen -->
  <div class="relative w-full aspect-[4/3] overflow-hidden bg-[#fff8ef]">
    <img src="${pro.imagen}" alt="${pro.nombre}" loading="lazy"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" />

    <!-- Favorito -->
    <button
      class="absolute right-3 top-3 grid h-10 w-10 place-items-center rounded-full bg-white/90 text-[#733702] shadow-sm backdrop-blur-sm transition hover:bg-[#F1860B] hover:text-white"
      aria-label="Marcar como favorito">
      ☆
    </button>
  </div>

  <!-- Info -->
  <div class="flex flex-1 flex-col p-5">
    <div class="flex items-start justify-between gap-3">
      <span
        class="inline-flex items-center rounded-full bg-[#F1860B]/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-[0.18em] text-[#F1860B] font-['Inter']">
        ${categoriaNombre}
      </span>

      <span class="inline-flex items-center rounded-full bg-[#733702] px-3 py-1 text-xs font-semibold text-white">
        ${pro.rating.toFixed(1)}
      </span>
    </div>

    <h2 class="mt-4 font-['Amaranth'] text-xl leading-tight text-slate-900 sm:text-[1.35rem]">
      ${pro.nombre}
    </h2>

    <p class="mt-3 text-sm leading-6 text-slate-600 font-['Inter'] line-clamp-3">
      ${descripcion}
    </p>

    <div class="mt-5">
      <p class="text-xs uppercase tracking-[0.14em] text-slate-500 font-['Inter']">
        Precio
      </p>
      <p class="mt-1 text-2xl font-bold tracking-tight text-slate-900 font-['Inter']">
        S/ ${pro.precio.toFixed(2)}
      </p>
    </div>

    <div class="mt-auto pt-5 flex items-center justify-between gap-3">
      <a href="producto.html?id=${pro.id}"
        class="inline-flex items-center justify-center rounded-xl border-2 border-[#F1860B] px-4 py-2.5 text-sm font-semibold text-[#F1860B] transition duration-300 hover:bg-[#F1860B] hover:text-white font-['Inter']">
        Ver más
      </a>

      <a href="carrito.html"
        class="btn-carrito group inline-flex h-12 w-12 items-center justify-center rounded-full bg-[#F1860B] text-white shadow-md transition duration-300 hover:scale-105 hover:bg-[#E52619] active:scale-95"
        data-id="${pro.id}">
        <!-- Icono (+) -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:hidden" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>

        <!-- Icono carrito -->
        <svg xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5 group-hover:block" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6h13M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z" />
        </svg>
      </a>
    </div>
  </div>
</article><!-- Card -->
