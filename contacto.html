<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naturin's – Snacks Naturales del Perú</title>
  <link rel="icon" href="img/Naturins-logo-mobile.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amaranth:wght@700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="font-['Inter'] bg-[#FDF6E3] text-[#2c1a00] min-h-screen flex flex-col">

  <!-- ── HEADER ── -->
  <header id="header"
    class="sticky top-0 w-full z-50 bg-white/97 backdrop-blur-md border-b-2 border-[#F1860B] h-[70px] flex items-center justify-between px-10 gap-6 shadow-sm">
  </header>

  <!-- Main-->

  <main class="flex-grow">

    <section class="max-w-6xl mx-auto px-6 py-16 grid md:grid-cols-2 gap-12 items-center">

      <!-- FONDO DECORATIVO -->
      <div class="absolute inset-0 -z-10 bg-gradient-to-br from-[#FDF6E3] via-[#fffaf0] to-[#f7f0df]"></div>

      <!-- IZQUIERDA -->
      <div class="space-y-6">

        <span class="text-[#98C01E] font-semibold tracking-[0.2em] text-xs uppercase">
          Hablemos
        </span>

        <h1 class="text-5xl md:text-6xl font-['Amaranth'] leading-tight text-[#2c1a00]">
          Estamos aquí <br>
          <span class="text-[#F1860B]">para escucharte</span>
        </h1>

        <p class="text-[#2c1a00]/70 text-base leading-relaxed max-w-md">
          ¿Tienes dudas sobre nuestros procesos artesanales o quieres realizar un pedido especial?
          Nuestro equipo está listo para ayudarte con atención personalizada.
        </p>

        <!-- INFO -->
        <div class="space-y-5 pt-6">

          <div class="flex items-center gap-4">
            <div class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-sm">
              <i class="fa-solid fa-envelope text-[#F1860B]"></i>
            </div>
            <div>
              <p class="text-xs font-semibold text-[#733702] tracking-wide">ESCRÍBENOS</p>
              <p class="text-sm text-[#2c1a00]/80">ventas@naturins.com.pe</p>
            </div>
          </div>

          <div class="flex items-center gap-4">
            <div class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-sm">
              <i class="fa-solid fa-phone text-[#F1860B]"></i>
            </div>
            <div>
              <p class="text-xs font-semibold text-[#733702] tracking-wide">LLÁMANOS</p>
              <p class="text-sm text-[#2c1a00]/80">+51 933 781 822</p>
            </div>
          </div>

          <div class="flex items-center gap-4">
            <div class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-sm">
              <i class="fa-solid fa-location-dot text-[#F1860B]"></i>
            </div>
            <div>
              <p class="text-xs font-semibold text-[#733702] tracking-wide">VISÍTANOS</p>
              <p class="text-sm text-[#2c1a00]/80">Lima, Perú</p>
            </div>
          </div>

        </div>
      </div>

      <!-- FORMULARIO -->
      <div class="relative">

        <div class="absolute -inset-1 bg-gradient-to-r from-[#F1860B] to-[#98C01E] rounded-3xl blur opacity-20"></div>

        <div class="relative bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border border-white">

          <form id="form-contacto" action="https://formspree.io/f/xgvpkpae" method="POST" class="space-y-4">

            <div class="grid md:grid-cols-2 gap-4">
              <input type="text" name="nombre" placeholder="Tu nombre"
                class="w-full p-3 rounded-xl bg-[#f5efe4] text-sm outline-none focus:ring-2 focus:ring-[#98C01E]"
                required>

              <input type="email" name="email" placeholder="tu@email.com"
                class="w-full p-3 rounded-xl bg-[#f5efe4] text-sm outline-none focus:ring-2 focus:ring-[#98C01E]"
                required>
            </div>

            <select name="asunto"
              class="w-full p-3 rounded-xl bg-[#f5efe4] text-sm outline-none focus:ring-2 focus:ring-[#98C01E]"
              required>
              <option value="">Motivo del contacto</option>
              <option>Información de Productos</option>
              <option>Soporte</option>
              <option>Pedidos</option>
            </select>

            <textarea name="mensaje" placeholder="Cuéntanos en qué podemos ayudarte..."
              class="w-full p-3 rounded-xl bg-[#f5efe4] text-sm h-32 resize-none outline-none focus:ring-2 focus:ring-[#98C01E]"
              required></textarea>

            <button type="submit"
              class="w-full py-3 rounded-full bg-gradient-to-r from-[#98C01E] to-[#7da814] text-white font-semibold shadow-md hover:scale-[1.02] transition">
              Enviar mensaje ➜
            </button>

            <p id="form-respuesta" class="text-sm mt-2 text-center"></p>

          </form>

        </div>
      </div>

    </section>

  </main>

  <!-- ── FOOTER ── -->
  <footer id="footer" class="bg-[#733702] text-white border-t-4 border-[#F1860B] pt-14 pb-8 px-6"></footer>

  <script src="js/index-js/loadComponent.js"></script>
  <script src="js/contacto/contacto.js"></script>
</body>

</html>
