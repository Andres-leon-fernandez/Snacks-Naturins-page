<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naturin's – Snacks Naturales del Perú</title>
  <link rel="icon" href="img/Naturins-logo-mobile.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amaranth:wght@700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="font-['Inter'] bg-[#FDF6E3] text-[#2c1a00] min-h-screen flex flex-col">

  <!-- ── HEADER ── -->
  <header id="header"
    class="sticky top-0 w-full z-50 bg-white/97 backdrop-blur-md border-b-2 border-[#F1860B] h-[70px] flex items-center justify-between px-10 gap-6 shadow-sm">
  </header>

  <!-- Main-->

  <main class="flex-grow">

    <!-- ── CONTACTO ── -->
    <section class="max-w-6xl mx-auto grid md:grid-cols-2 gap-10 items-center">

      <!-- IZQUIERDA -->
      <div class="space-y-5">

        <span class="text-[#98C01E] font-semibold tracking-wide text-sm">
          HABLEMOS
        </span>

        <h1 class="text-4xl md:text-5xl font-['Amaranth'] text-[#2c1a00] leading-tight">
          Estamos aquí <br> para escucharte.
        </h1>

        <p class="text-[#2c1a00]/80 text-sm md:text-base leading-relaxed max-w-md">
          ¿Tienes dudas sobre nuestros procesos artesanales o quieres realizar un pedido especial?
          Nuestro equipo está listo para ayudarte.
        </p>

        <!-- INFO -->
        <div class="space-y-4 pt-4">

          <div class="flex items-center gap-4">
            <div class="w-12 h-12 flex items-center justify-center rounded-full bg-[#e8e2d9]">
              <i class="fa-solid fa-envelope text-[#733702]"></i>
            </div>
            <div>
              <p class="text-xs font-semibold text-[#733702]">ESCRÍBENOS</p>
              <p class="text-sm text-[#2c1a00]">ventas@naturins.com.pe</p>
            </div>
          </div>

          <div class="flex items-center gap-4">
            <div class="w-12 h-12 flex items-center justify-center rounded-full bg-[#e8e2d9]">
              <i class="fa-solid fa-phone text-[#733702]"></i>
            </div>
            <div>
              <p class="text-xs font-semibold text-[#733702]">LLÁMANOS</p>
              <p class="text-sm text-[#2c1a00]">+51 933 781 822</p>
            </div>
          </div>

          <div class="flex items-center gap-4">
            <div class="w-12 h-12 flex items-center justify-center rounded-full bg-[#e8e2d9]">
              <i class="fa-solid fa-location-dot text-[#733702]"></i>
            </div>
            <div>
              <p class="text-xs font-semibold text-[#733702]">VISÍTANOS</p>
              <p class="text-sm text-[#2c1a00]">Lima, Perú</p>
            </div>
          </div>

        </div>

      </div>

      <!-- FORMULARIO -->
      <div class="bg-white p-8 rounded-2xl shadow-md">

        <form id="formulario" class="space-y-4">

          <div class="grid md:grid-cols-2 gap-4">
            <input type="text" placeholder="Ej. Juan Pérez"
              class="w-full p-3 rounded-xl bg-[#eae3d9] text-sm outline-none">
            <input type="email" placeholder="juan@correo.com"
              class="w-full p-3 rounded-xl bg-[#eae3d9] text-sm outline-none">
          </div>

          <select class="w-full p-3 rounded-xl bg-[#eae3d9] text-sm outline-none">
            <option>Información de Productos</option>
            <option>Soporte</option>
            <option>Pedidos</option>
          </select>

          <textarea placeholder="¿Cómo podemos ayudarte hoy?"
            class="w-full p-3 rounded-xl bg-[#eae3d9] text-sm h-32 resize-none outline-none"></textarea>

          <button type="submit"
            class="w-full py-3 rounded-full bg-[#98C01E] font-semibold hover:bg-[#7da814] transition">
            Enviar Mensaje ➤
          </button>

        </form>

      </div>

    </section>

  </main>

  <!-- ── FOOTER ── -->
  <footer id="footer" class="bg-[#733702] text-white border-t-4 border-[#F1860B] pt-14 pb-8 px-6"></footer>

  <script src="js/index-js/loadComponent.js"></script>
  <script src="js/contacto/contacto.js"></script>
</body>

</html>
